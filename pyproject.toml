[project]
name = "traderadar"
version = "0.1.0"
description = "Daily OHLCV tracker with a CLI writer, a read-only API and a web dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.32",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["traderadar", "backend"]
