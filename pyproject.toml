[project]
name = "traderadar"
version = "0.1.0"
description = "Daily OHLCV tracker with a CLI writer, a read-only API and a web dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "requests>=2.32",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Test-only; the runtime install stays as small as it was. httpx is what
# FastAPI's TestClient runs on. Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["traderadar", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# The default set (pyflakes + the pycodestyle errors that matter) plus import
# sorting, which the codebase already follows by hand.
select = ["E4", "E7", "E9", "F", "I"]
