[project]
name = "traderadar"
version = "0.1.0"
description = "Daily OHLCV tracker with a CLI writer and a Streamlit dashboard."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
    "PyYAML>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["traderadar"]
